# Textos de la explicacion por reglas en espanol. Mismas claves que messages.properties.
# {0} es una cifra que rellena el codigo.
rules.travelMismatch=El recorrido calculado no coincide con el declarado. Revisa las marcas de la foto y la calibración antes de sacar conclusiones; las curvas siguen disponibles como referencia.
rules.opening=Este análisis guardado muestra {0}.
rules.closing=Son tendencias geométricas a partir de una foto marcada, no una recomendación de reglaje personal ni una medición de laboratorio.

rules.leverage.withoutProgression=una respuesta de la suspensión que conviene leer junto a su curva de palanca
rules.leverage.progression=(progresión: {0})
rules.leverage.bottomOutRising=, con la relación de palanca subiendo de nuevo en el último tramo del recorrido

rules.character.unknown=una respuesta de palanca que conviene leer junto a su curva
rules.character.REGRESSIVE=una respuesta de palanca regresiva, que exige más al amortiguador al final del recorrido
rules.character.LINEAR=una respuesta de palanca lineal, así que la suspensión se comporta de forma predecible
rules.character.SLIGHTLY_PROGRESSIVE=una respuesta de palanca ligeramente progresiva
rules.character.MEDIUM=una respuesta de palanca progresiva
rules.character.HIGH=una respuesta de palanca claramente progresiva, con un apoyo que va creciendo
rules.character.VERY_HIGH=una respuesta de palanca muy progresiva, con mucho margen frente a los impactos que agotarían el recorrido de golpe

rules.pedalling.SOFT=Al pedalear, el amortiguador se lleva parte de tu esfuerzo, así que en las subidas lisas echarás mano del bloqueo más a menudo.
rules.pedalling.BALANCED=Pedalea con equilibrio: parte de tu esfuerzo llega al amortiguador, pero no lo suficiente para estorbar.
rules.pedalling.FIRM=Pedalea con eficiencia: la cadena mantiene la bici extendida, así que tu esfuerzo se convierte en avance y no se pierde en el amortiguador.
rules.pedalling.VERY_FIRM=Pedalea con eficiencia: la cadena mantiene la bici extendida, así que tu esfuerzo se convierte en avance y no se pierde en el amortiguador.
rules.pedalling.EXTREME=Pedalea con mucha firmeza: casi nada de tu esfuerzo llega al amortiguador.

rules.braking.EXTENDS_UNDER_BRAKING=Al frenar, la parte trasera se levanta un poco, así que la bici se siente menos asentada y la pendiente parece más empinada, aunque el amortiguador copia mejor el terreno.
rules.braking.BALANCED=Al frenar, se queda en el equilibrio que buscan la mayoría de las bicis modernas.
rules.braking.SQUATS_UNDER_BRAKING=Al frenar, la parte trasera se asienta, lo que hace la bici más estable, como consecuencia de no copiar el terreno con tanta precisión.
rules.braking.SITS_HARD_UNDER_BRAKING=Al frenar, la parte trasera se asienta claramente, lo que hace la bici muy estable, como consecuencia de copiar menos el terreno.

rules.axlePath=El eje trasero retrocede hasta {0}, lo que le ayuda a tragarse los golpes secos.
