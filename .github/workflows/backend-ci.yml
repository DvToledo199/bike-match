name: Backend CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    # The Spring context (and its tests) needs a real PostgreSQL to start,
    # so the job spins one up as a service container. Tests use their own
    # database (bikematch_test), the same one they use locally.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bikematch_test
          POSTGRES_USER: bikematch
          POSTGRES_PASSWORD: bikematch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bikematch -d bikematch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test the backend
        working-directory: backend
        run: JWT_SECRET_BASE64="$(openssl rand -base64 32)" ./mvnw verify

      # JaCoCo already fails the build below 60% line coverage; this shows the figures in the run.
      - name: Summarise test coverage
        if: always()
        working-directory: backend
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR > 1 { lm += $8; lc += $9; bm += $6; bc += $7 }
              END { printf "### Backend test coverage\n\n| Lines | Branches |\n|---|---|\n| %.1f%% | %.1f%% |\n",
                    100 * lc / (lm + lc), 100 * bc / (bm + bc) }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
