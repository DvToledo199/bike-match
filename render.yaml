# Render Blueprint: creates the API and the website from this repository.
# No secret lives here. Render asks for every value marked "sync: false" when the Blueprint is
# first created; the database is on Neon, outside Render.
services:
  # --- Backend: Spring Boot API, built from backend/Dockerfile ---
  - type: web
    name: bikematch-api
    runtime: docker
    rootDir: backend
    # Both paths count from rootDir, so they point at backend/Dockerfile and backend/.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      # Neon connection, without credentials: jdbc:postgresql://<host>/<database>?sslmode=require
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      # Random 256-bit key in base64, generated by Render: signs the login tokens.
      - key: JWT_SECRET_BASE64
        generateValue: true
      # The website's address, e.g. https://bikematch.onrender.com, once it exists.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: INTERPRETATION_PROVIDER
        value: google-genai
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      # First administrator: the password goes only as a bcrypt hash.
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_USERNAME
        sync: false
      - key: INITIAL_ADMIN_PASSWORD_HASH
        sync: false

  # --- Frontend: React build served as static files ---
  - type: web
    name: bikematch
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Vite needs Node 20.19+ or 22.12+.
      - key: NODE_VERSION
        value: "22"
      # The API's address, e.g. https://bikematch-api.onrender.com. Read at build time.
      - key: VITE_API_URL
        sync: false
