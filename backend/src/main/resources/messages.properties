# Rules-based explanation texts in English, the base language. The Spanish ones live in
# messages_es.properties with exactly the same keys. {0} is a figure the code fills in.
rules.travelMismatch=The calculated travel does not match the declared travel. Review the photo marks and calibration before drawing conclusions; the curves remain available as a reference.
rules.opening=This saved analysis shows {0}.
rules.closing=These are geometric tendencies from a marked photo, not a personal setup recommendation or a laboratory measurement.

rules.leverage.withoutProgression=a suspension response that should be read together with its leverage curve
rules.leverage.progression=(progression: {0})
rules.leverage.bottomOutRising=, with the leverage rising again over the last stretch of travel

# Linear means predictable, and nothing more; high progression does not imply pop.
rules.character.unknown=a leverage response to be read together with its curve
rules.character.REGRESSIVE=a regressive leverage response, which asks more of the shock at the end of the travel
rules.character.LINEAR=a linear leverage response, so the suspension behaves predictably
rules.character.SLIGHTLY_PROGRESSIVE=a slightly progressive leverage response
rules.character.MEDIUM=a progressive leverage response
rules.character.HIGH=a strongly progressive leverage response, with growing support
rules.character.VERY_HIGH=a very progressive leverage response, with a wide margin against hits that would use up the travel at once

# Pedalling in one sentence: whether the effort goes into moving forward or into the shock.
rules.pedalling.SOFT=Pedalling, the shock takes up part of your effort, so on smooth climbs you will reach for the lockout more often.
rules.pedalling.BALANCED=It pedals in balance: part of your effort reaches the shock, but not enough to get in the way.
rules.pedalling.FIRM=It pedals efficiently: the chain keeps the bike extended, so your effort goes into moving forward rather than into the shock.
rules.pedalling.VERY_FIRM=It pedals efficiently: the chain keeps the bike extended, so your effort goes into moving forward rather than into the shock.
rules.pedalling.EXTREME=It pedals very firmly, with almost none of your effort reaching the shock.

# Braking, said the way the rider feels it: a rear that lifts, or one that settles.
rules.braking.EXTENDS_UNDER_BRAKING=Braking, the rear lifts a little, so the bike feels less settled and the slope feels steeper, while the shock copies the ground better.
rules.braking.BALANCED=Braking, it sits in the balance most modern bikes aim for.
rules.braking.SQUATS_UNDER_BRAKING=Braking, the rear settles, which makes the bike more stable, as a consequence of not copying the ground as closely.
rules.braking.SITS_HARD_UNDER_BRAKING=Braking, the rear settles clearly, which makes the bike very stable, as a consequence of copying the ground less closely.

rules.axlePath=The rear axle moves up to {0} rearward, which helps it swallow square edges.
