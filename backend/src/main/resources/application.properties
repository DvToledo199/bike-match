spring.application.name=bikematch

# Load the repository .env for launches from backend/ or from the repository root.
# Environment variables still take precedence. Never commit the real file.
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# Local development is private by default; deployment must opt in explicitly.
server.address=${SERVER_ADDRESS:127.0.0.1}

# Never silently truncate fractional tooth counts supplied in JSON.
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-numbers-for-enums=true

# Accept photos up to 10 MB; the request limit includes the small multipart envelope.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# --- Datasource: values come from environment variables, with local-dev defaults ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:bikematch}
spring.datasource.username=${POSTGRES_USER:bikematch}
spring.datasource.password=${POSTGRES_PASSWORD:bikematch}

# --- JPA: the schema is owned by Flyway migrations, Hibernate only validates it ---
spring.jpa.hibernate.ddl-auto=validate

# --- App info (version is filtered in from pom.xml by the Maven build) ---
app.version=@project.version@

# --- CORS: allowed frontend origins (comma-separated), overridable per environment ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- JWT: private signing key and configurable token lifetime ---
app.jwt.secret=${JWT_SECRET_BASE64}
app.jwt.expiration=${JWT_EXPIRATION:PT8H}

# --- Optional first moderator: all three values must come from ignored environment variables ---
app.initial-moderator.email=${INITIAL_MODERATOR_EMAIL:}
app.initial-moderator.username=${INITIAL_MODERATOR_USERNAME:}
app.initial-moderator.password-hash=${INITIAL_MODERATOR_PASSWORD_HASH:}

# --- Optional first administrator: same rules as the moderator above ---
app.initial-admin.email=${INITIAL_ADMIN_EMAIL:}
app.initial-admin.username=${INITIAL_ADMIN_USERNAME:}
app.initial-admin.password-hash=${INITIAL_ADMIN_PASSWORD_HASH:}

# --- Image storage: server-side credentials, never exposed to the frontend ---
app.cloudinary.url=${CLOUDINARY_URL:}

# --- Interpretation: deterministic rules by default; Gemini through Spring AI is opt-in ---
# INTERPRETATION_PROVIDER is the only switch: rules or google-genai. Spring AI only builds its
# Gemini client for google-genai, so the rules mode starts without any key.
spring.ai.model.chat=${INTERPRETATION_PROVIDER:rules}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:}
spring.ai.google.genai.chat.options.response-mime-type=application/json
# Spring AI would send 0.7; 1.0 is Gemini's own default, which the requests used before Spring AI.
spring.ai.google.genai.chat.options.temperature=1.0
# One attempt: a failed call falls back to the rules text instead of retrying against the quota.
# GeminiClientConfig does the same for the Google client, which also retries on its own.
spring.ai.retry.max-attempts=1
# The Google client has no time limit of its own; GeminiClientConfig applies this one.
app.interpretation.gemini.timeout=${GEMINI_TIMEOUT:PT60S}
app.interpretation.generation-cooldown=${INTERPRETATION_GENERATION_COOLDOWN:PT30S}

# --- Rules-based explanation texts: messages.properties (English) and messages_es.properties ---
# Without this, an English request on a server set to Spanish would get the Spanish texts.
spring.messages.fallback-to-system-locale=false
